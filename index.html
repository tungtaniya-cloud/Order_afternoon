<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點餐系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .menu-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .menu-section.active {
            display: block;
        }

        .menu-title {
            font-size: 20px;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 5px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .menu-note {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        .menu-item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }

        .item-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .item-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .option-group {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
        }

        .option-label {
            font-size: 12px;
            color: #666;
            margin-right: 5px;
        }

        .opt-btn {
            padding: 5px 12px;
            border: 2px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .opt-btn:hover {
            border-color: #667eea;
        }

        .opt-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .opt-btn.size-btn.selected {
            background: #667eea;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #667eea;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: #5a6fd6;
        }

        .qty-display {
            font-size: 16px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        /* Tab 分類切換 */
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0 15px;
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            cursor: grab;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 8px 18px;
            border: 2px solid #667eea;
            border-radius: 25px;
            background: white;
            color: #667eea;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .tab-btn:hover {
            background: #eef0ff;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        /* 訂單資訊置底固定置中 */
        .order-section {
            background: #fff3cd;
            border-radius: 15px 15px 0 0;
            padding: 15px 20px;
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 15cm;
            max-width: calc(100% - 20px);
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            max-height: 60vh;
            overflow-y: auto;
            transition: max-height 0.3s ease;
        }

        .order-section.collapsed {
            max-height: 60px;
            overflow: hidden;
        }

        .order-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .order-toggle-arrow {
            font-size: 18px;
            transition: transform 0.3s;
            color: #856404;
        }

        .order-section.collapsed .order-toggle-arrow {
            transform: rotate(180deg);
        }

        .order-body {
            margin-top: 10px;
        }

        .order-section.collapsed .order-body {
            display: none;
        }

        /* 為固定底部留出空間 */
        .container {
            padding-bottom: 80px;
        }

        .order-title {
            font-size: 18px;
            font-weight: bold;
            color: #856404;
            margin-bottom: 15px;
        }

        .orderer-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .orderer-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .order-summary {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-total {
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            color: #333;
            margin-bottom: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .copy-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .empty-order {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .price-tag {
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        .no-menu {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-menu a {
            color: #667eea;
            text-decoration: none;
        }

        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }

        #orderBadge {
            font-size: 14px;
            color: #e65100;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .item-options {
                flex-direction: column;
                align-items: flex-start;
            }
            .option-group {
                margin-bottom: 5px;
            }
            .container {
                padding: 15px;
                padding-bottom: 80px;
            }
            .order-section {
                padding: 12px 15px;
            }
            .tab-btn {
                padding: 6px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>點餐</h1>
        <p class="subtitle" id="pageSubtitle"></p>

        <div id="categoryTabs" class="category-tabs"></div>

        <div id="menuContainer">
            <div class="no-menu">
                <p>尚未設定菜單</p>
                <p>請管理員先至 <a href="admin.html">管理後台</a> 設定菜單</p>
            </div>
        </div>
    </div>

    <div class="order-section collapsed" id="orderSection">
        <div class="order-toggle" onclick="toggleOrder()">
            <div class="order-title" style="margin-bottom:0">訂單資訊 <span id="orderBadge"></span></div>
            <span class="order-toggle-arrow">▲</span>
        </div>
        <div class="order-body">
            <div class="success-msg" id="successMsg">訂單已成功送出！</div>
            <input type="text" class="orderer-input" id="ordererName" placeholder="請輸入點單人姓名">

            <div class="order-summary" id="orderSummary">
                <div class="empty-order">尚未選擇任何品項</div>
            </div>

            <div class="order-total" id="orderTotal">總計: $0</div>

            <button class="submit-btn" id="submitBtn" onclick="submitOrder()" disabled>送出訂單</button>
            <button class="copy-btn" id="copyBtn" onclick="copyOrder()">複製訂單內容</button>
        </div>
    </div>

    <script>
        let menuData = null;
        let optionsData = null;
        let orders = {};
        let googleScriptUrl = '';

        // 載入資料
        function loadData() {
            const savedMenu = localStorage.getItem('drinkMenuData');
            if (savedMenu) menuData = JSON.parse(savedMenu);

            const savedOptions = localStorage.getItem('drinkOptionsData');
            if (savedOptions) optionsData = JSON.parse(savedOptions);

            googleScriptUrl = localStorage.getItem('googleScriptUrl') || '';

            renderMenu();
        }

        // 切換訂單面板
        function toggleOrder() {
            document.getElementById('orderSection').classList.toggle('collapsed');
        }

        // Tab 滑鼠拖曳滑動
        function initTabsDrag() {
            const tabs = document.getElementById('categoryTabs');
            let isDown = false, startX, scrollLeft;
            tabs.addEventListener('mousedown', e => {
                isDown = true; tabs.style.cursor = 'grabbing';
                startX = e.pageX - tabs.offsetLeft;
                scrollLeft = tabs.scrollLeft;
            });
            tabs.addEventListener('mouseleave', () => { isDown = false; tabs.style.cursor = 'grab'; });
            tabs.addEventListener('mouseup', () => { isDown = false; tabs.style.cursor = 'grab'; });
            tabs.addEventListener('mousemove', e => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - tabs.offsetLeft;
                tabs.scrollLeft = scrollLeft - (x - startX);
            });
        }

        // 切換分類 Tab
        function switchTab(catIndex) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === catIndex);
            });
            document.querySelectorAll('.menu-section').forEach((section, i) => {
                section.classList.toggle('active', i === catIndex);
            });
        }

        // 渲染菜單
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const tabsContainer = document.getElementById('categoryTabs');

            if (!menuData || !menuData.categories || menuData.categories.length === 0) {
                tabsContainer.innerHTML = '';
                container.innerHTML = `
                    <div class="no-menu">
                        <p>尚未設定菜單</p>
                        <p>請管理員先至 <a href="admin.html">管理後台</a> 設定菜單</p>
                    </div>
                `;
                return;
            }

            // 渲染分類 Tabs
            let tabsHtml = '';
            menuData.categories.forEach((cat, catIndex) => {
                tabsHtml += `<button class="tab-btn${catIndex === 0 ? ' active' : ''}" onclick="switchTab(${catIndex})">${cat.name}</button>`;
            });
            tabsContainer.innerHTML = tabsHtml;

            let html = '';
            let itemIndex = 0;

            menuData.categories.forEach((cat, catIndex) => {
                html += `
                    <div class="menu-section${catIndex === 0 ? ' active' : ''}">
                        <div class="menu-title">${cat.name}</div>
                        ${cat.note ? `<div class="menu-note">${cat.note}</div>` : ''}
                `;

                cat.items.forEach((item, idx) => {
                    const itemKey = `item_${itemIndex}`;
                    const sizes = item.sizes || [{ name: '', price: item.priceM || item.priceL || 0 }];

                    orders[itemKey] = {
                        name: item.name,
                        qty: 0,
                        size: sizes.length === 1 ? sizes[0] : null,
                        options: {},
                        price: sizes.length === 1 ? sizes[0].price : 0,
                        sizes: sizes
                    };

                    // 價格顯示
                    let priceDisplay = '';
                    if (sizes.length === 1) {
                        priceDisplay = `$${sizes[0].price}`;
                    } else {
                        priceDisplay = sizes.map(s => `${s.name} $${s.price}`).join(' / ');
                    }

                    html += `
                        <div class="menu-item" data-item-key="${itemKey}">
                            <div class="item-header">
                                <span class="item-name">${item.name}</span>
                                <span class="price-tag">${priceDisplay}</span>
                            </div>
                            ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                            <div class="item-options">
                    `;

                    // 尺寸選項（只有多於1個時顯示）
                    if (sizes.length > 1) {
                        html += `
                            <div class="option-group">
                                <span class="option-label">規格:</span>
                        `;
                        sizes.forEach((size, sizeIdx) => {
                            html += `<button class="opt-btn size-btn" data-size-idx="${sizeIdx}" data-price="${size.price}" data-size-name="${size.name}">${size.name}</button>`;
                        });
                        html += `</div>`;
                    }

                    // 動態選項
                    if (optionsData && optionsData.categories && optionsData.categories.length > 0) {
                        optionsData.categories.forEach((optCat, optCatIdx) => {
                            if (optCat.options && optCat.options.length > 0) {
                                html += `
                                    <div class="option-group" data-opt-cat="${optCatIdx}">
                                        <span class="option-label">${optCat.name}:</span>
                                `;
                                optCat.options.forEach((opt, optIdx) => {
                                    html += `<button class="opt-btn option-btn" data-opt-cat="${optCatIdx}" data-opt-val="${opt}">${opt}</button>`;
                                });
                                html += `</div>`;
                            }
                        });
                    }

                    html += `
                                <div class="quantity-control">
                                    <button class="qty-btn minus-btn">-</button>
                                    <span class="qty-display">0</span>
                                    <button class="qty-btn plus-btn">+</button>
                                </div>
                            </div>
                        </div>
                    `;

                    itemIndex++;
                });

                html += '</div>';
            });

            container.innerHTML = html;
            bindEvents();
            initTabsDrag();
        }

        // 綁定事件
        function bindEvents() {
            document.querySelectorAll('.menu-item').forEach(item => {
                const itemKey = item.dataset.itemKey;

                // 尺寸按鈕
                item.querySelectorAll('.size-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        item.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        const sizeIdx = parseInt(btn.dataset.sizeIdx);
                        orders[itemKey].size = orders[itemKey].sizes[sizeIdx];
                        orders[itemKey].price = orders[itemKey].sizes[sizeIdx].price;
                        updateOrder();
                    });
                });

                // 選項按鈕
                item.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const optCat = btn.dataset.optCat;
                        item.querySelectorAll(`.option-btn[data-opt-cat="${optCat}"]`).forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        orders[itemKey].options[optCat] = btn.dataset.optVal;
                        updateOrder();
                    });
                });

                // 數量按鈕
                item.querySelector('.minus-btn').addEventListener('click', () => changeQty(itemKey, -1, item));
                item.querySelector('.plus-btn').addEventListener('click', () => changeQty(itemKey, 1, item));
            });
        }

        function changeQty(itemKey, delta, menuItem) {
            const qtyDisplay = menuItem.querySelector('.qty-display');
            let newQty = orders[itemKey].qty + delta;
            if (newQty < 0) newQty = 0;

            orders[itemKey].qty = newQty;
            qtyDisplay.textContent = newQty;
            updateOrder();
        }

        function updateOrder() {
            const summaryDiv = document.getElementById('orderSummary');
            const totalDiv = document.getElementById('orderTotal');
            const submitBtn = document.getElementById('submitBtn');
            const copyBtn = document.getElementById('copyBtn');

            let html = '';
            let total = 0;
            let hasItems = false;

            for (const [key, order] of Object.entries(orders)) {
                if (order.qty > 0) {
                    hasItems = true;
                    const itemTotal = order.price * order.qty;
                    total += itemTotal;

                    const details = [];
                    if (order.size && order.size.name) details.push(order.size.name);

                    // 加入選項
                    if (optionsData && optionsData.categories) {
                        Object.keys(order.options).forEach(catIdx => {
                            details.push(order.options[catIdx]);
                        });
                    }

                    const detailStr = details.length > 0 ? ` (${details.join('/')})` : '';

                    html += `
                        <div class="order-item">
                            <span>${order.name}${detailStr} x${order.qty}</span>
                            <span>$${itemTotal}</span>
                        </div>
                    `;
                }
            }

            if (!hasItems) {
                html = '<div class="empty-order">尚未選擇任何品項</div>';
            }

            summaryDiv.innerHTML = html;
            totalDiv.textContent = `總計: $${total}`;
            submitBtn.disabled = !hasItems;
            copyBtn.style.display = hasItems ? 'block' : 'none';

            // 更新 badge 顯示數量與金額
            const badge = document.getElementById('orderBadge');
            let totalQty = 0;
            for (const order of Object.values(orders)) {
                totalQty += order.qty;
            }
            badge.textContent = totalQty > 0 ? `(${totalQty}杯 $${total})` : '';
        }

        async function submitOrder() {
            const ordererName = document.getElementById('ordererName').value.trim();

            if (!ordererName) {
                alert('請輸入點單人姓名！');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = '送出中...';
            submitBtn.disabled = true;

            // 取得選項類別名稱
            const optionNames = [];
            if (optionsData && optionsData.categories) {
                optionsData.categories.forEach(cat => {
                    if (cat.options && cat.options.length > 0) {
                        optionNames.push(cat.name);
                    }
                });
            }

            // 準備訂單資料
            const orderList = [];
            let total = 0;

            for (const [key, order] of Object.entries(orders)) {
                if (order.qty > 0) {
                    const subtotal = order.price * order.qty;
                    total += subtotal;

                    // 建立選項值物件（用類別名稱作為 key）
                    const optionValues = {};
                    if (optionsData && optionsData.categories) {
                        Object.keys(order.options).forEach(catIdx => {
                            const catName = optionsData.categories[catIdx].name;
                            optionValues[catName] = order.options[catIdx];
                        });
                    }

                    orderList.push({
                        item: order.name,
                        size: order.size ? order.size.name : '',
                        optionValues: optionValues,
                        qty: order.qty,
                        price: order.price,
                        subtotal: subtotal
                    });
                }
            }

            const payload = {
                orderer: ordererName,
                orders: orderList,
                optionNames: optionNames,
                total: total
            };

            // 送到 Google Sheets
            if (googleScriptUrl) {
                try {
                    await fetch(googleScriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    document.getElementById('successMsg').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('successMsg').style.display = 'none';
                    }, 5000);

                } catch (err) {
                    console.error('送出失敗:', err);
                    alert('送出失敗，請使用複製訂單功能');
                }
            } else {
                // 沒有設定 Google Sheets，顯示訂單
                let orderText = `【訂單】\n點單人: ${ordererName}\n\n`;
                orderList.forEach(o => {
                    const detail = [o.size, o.options].filter(x => x).join('/');
                    orderText += `${o.item}${detail ? ' (' + detail + ')' : ''} x${o.qty} = $${o.subtotal}\n`;
                });
                orderText += `\n總計: $${total}`;
                alert('訂單內容：\n\n' + orderText);
            }

            submitBtn.textContent = '送出訂單';
            submitBtn.disabled = false;
            resetOrder();
        }

        function resetOrder() {
            for (const key of Object.keys(orders)) {
                orders[key].qty = 0;
                orders[key].size = orders[key].sizes.length === 1 ? orders[key].sizes[0] : null;
                orders[key].options = {};
                orders[key].price = orders[key].sizes.length === 1 ? orders[key].sizes[0].price : 0;
            }

            document.querySelectorAll('.menu-item').forEach(item => {
                item.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
                item.querySelector('.qty-display').textContent = '0';
            });

            updateOrder();
        }

        function copyOrder() {
            const ordererName = document.getElementById('ordererName').value.trim() || '未填寫';

            let orderText = `【訂單】\n點單人: ${ordererName}\n\n`;
            let total = 0;

            for (const [key, order] of Object.entries(orders)) {
                if (order.qty > 0) {
                    const itemTotal = order.price * order.qty;
                    total += itemTotal;

                    const details = [];
                    if (order.size && order.size.name) details.push(order.size.name);
                    if (optionsData && optionsData.categories) {
                        Object.keys(order.options).forEach(catIdx => {
                            details.push(order.options[catIdx]);
                        });
                    }
                    const detailStr = details.length > 0 ? ` (${details.join('/')})` : '';

                    orderText += `${order.name}${detailStr} x${order.qty} = $${itemTotal}\n`;
                }
            }

            orderText += `\n總計: $${total}`;

            navigator.clipboard.writeText(orderText).then(() => {
                alert('訂單已複製到剪貼簿！');
            }).catch(() => {
                prompt('請手動複製:', orderText);
            });
        }

        // 初始化
        loadData();
    </script>
