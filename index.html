<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點餐系統</title>
    <style>
        * { box-sizing: border-box; font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; padding-bottom: 80px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .category-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 15px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none; cursor: grab; }
        .category-tabs::-webkit-scrollbar { display: none; }
        .cat-tab-btn { padding: 8px 18px; border: 2px solid #667eea; border-radius: 25px; background: white; color: #667eea; font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0; }
        .cat-tab-btn:hover { background: #eef0ff; }
        .cat-tab-btn.active { background: #667eea; color: white; }
        .menu-section { background: #f8f9fa; border-radius: 15px; padding: 20px; margin-bottom: 20px; display: none; }
        .menu-section.active { display: block; }
        .menu-title { font-size: 20px; font-weight: bold; color: #4a5568; margin-bottom: 5px; padding-bottom: 10px; border-bottom: 2px solid #667eea; }
        .menu-note { font-size: 12px; color: #888; margin-bottom: 15px; }
        .menu-item { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .item-name { font-weight: bold; font-size: 16px; color: #333; }
        .item-desc { font-size: 12px; color: #888; margin-bottom: 10px; }
        .item-options { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .option-group { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .option-label { font-size: 12px; color: #666; margin-right: 5px; }
        .opt-btn { padding: 5px 12px; border: 2px solid #ddd; border-radius: 20px; background: white; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .opt-btn:hover { border-color: #667eea; }
        .opt-btn.selected { background: #667eea; color: white; border-color: #667eea; }
        .quantity-control { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 30px; height: 30px; border: none; border-radius: 50%; background: #667eea; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-btn:hover { background: #5a6fd6; }
        .qty-display { font-size: 16px; font-weight: bold; min-width: 30px; text-align: center; }
        .order-section { background: #fff3cd; border-radius: 15px 15px 0 0; padding: 15px 20px; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 15cm; max-width: calc(100% - 20px); z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); max-height: 60vh; overflow-y: auto; transition: max-height 0.3s ease; }
        .order-section.collapsed { max-height: 60px; overflow: hidden; }
        .order-toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .order-toggle-arrow { font-size: 18px; transition: transform 0.3s; color: #856404; }
        .order-section.collapsed .order-toggle-arrow { transform: rotate(180deg); }
        .order-body { margin-top: 10px; }
        .order-section.collapsed .order-body { display: none; }
        .order-title { font-size: 18px; font-weight: bold; color: #856404; margin-bottom: 15px; }
        #orderBadge { font-size: 14px; color: #e65100; font-weight: bold; }
        .orderer-input { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 15px; }
        .orderer-input:focus { outline: none; border-color: #667eea; }
        .order-summary { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; max-height: 250px; overflow-y: auto; }
        .order-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .order-item:last-child { border-bottom: none; }
        .order-total { font-size: 20px; font-weight: bold; text-align: right; color: #333; margin-bottom: 15px; }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
        .copy-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; display: none; }
        .copy-btn:hover { background: #218838; }
        .empty-order { text-align: center; color: #999; padding: 20px; }
        .price-tag { background: #667eea; color: white; padding: 3px 8px; border-radius: 10px; font-size: 12px; }
        .success-msg { background: #d4edda; color: #155724; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; }
        @media (max-width: 600px) { .item-options { flex-direction: column; align-items: flex-start; } .option-group { margin-bottom: 5px; } .container { padding: 15px; padding-bottom: 80px; } .cat-tab-btn { padding: 6px 14px; font-size: 13px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>點餐</h1>
        <p class="subtitle" id="pageSubtitle"></p>
        <div id="categoryTabs" class="category-tabs"></div>
        <div id="menuContainer"></div>
    </div>
    <div class="order-section collapsed" id="orderSection">
        <div class="order-toggle" onclick="toggleOrder()">
            <div class="order-title" style="margin-bottom:0">訂單資訊 <span id="orderBadge"></span></div>
            <span class="order-toggle-arrow">&#9650;</span>
        </div>
        <div class="order-body">
            <div class="success-msg" id="successMsg">訂單已成功送出！</div>
            <input type="text" class="orderer-input" id="ordererName" placeholder="請輸入點單人姓名">
            <div class="order-summary" id="orderSummary"><div class="empty-order">尚未選擇任何品項</div></div>
            <div class="order-total" id="orderTotal">總計: $0</div>
            <button class="submit-btn" id="submitBtn" onclick="submitOrder()" disabled>送出訂單</button>
            <button class="copy-btn" id="copyBtn" onclick="copyOrder()">複製訂單內容</button>
        </div>
    </div>
    <script>
        const menuData = {"categories":[{"name":"火鍋套餐","showPricedOptions":true,"items":[{"name":"原味養生","sizes":[{"name":"單價","price":40}]},{"name":"特製咖哩","sizes":[{"name":"單價","price":60}]},{"name":"南瓜初鹿鮮奶","sizes":[{"name":"單價","price":70}]},{"name":"台東初鹿鮮奶","sizes":[{"name":"單價","price":80}]},{"name":"蛤蠣鮮味","sizes":[{"name":"單價","price":80}]},{"name":"干貝鮮味","sizes":[{"name":"單價","price":80}]},{"name":"(辣)香辣養生","sizes":[{"name":"單價","price":50}]},{"name":"(辣)泰式酸辣","sizes":[{"name":"單價","price":60}]},{"name":"(辣)川味麻辣","sizes":[{"name":"單價","price":60}]},{"name":"(辣)韓式泡菜","sizes":[{"name":"單價","price":60}]},{"name":"(辣)茴香麻奶","sizes":[{"name":"單價","price":80}]},{"name":"(辣)重慶酸辣","sizes":[{"name":"單價","price":80}]},{"name":"(素)菌菇","sizes":[{"name":"單價","price":40}]},{"name":"(素)茴香麻辣","sizes":[{"name":"單價","price":60}]},{"name":"(素)初鹿鮮奶","sizes":[{"name":"單價","price":80}]},{"name":"(素)蕃茄風味","sizes":[{"name":"單價","price":60}]}]},{"name":"單點系列","items":[{"name":"手工土雞蛋餃","sizes":[{"name":"單價","price":50}]},{"name":"龍鳳丸(蝦肉)","sizes":[{"name":"單價","price":60}]},{"name":"魚板豆腐","sizes":[{"name":"單價","price":60}]},{"name":"花枝飛魚丸","sizes":[{"name":"單價","price":60}]},{"name":"黑輪(花枝)","sizes":[{"name":"單價","price":60}]},{"name":"黑豬肉貢丸","sizes":[{"name":"單價","price":60}]},{"name":"鮮味扇貝","sizes":[{"name":"單價","price":120}]},{"name":"鮮蛤蠣","sizes":[{"name":"單價","price":120}]},{"name":"東石蚵仔","sizes":[{"name":"單價","price":120}]},{"name":"澎湖透柚","sizes":[{"name":"單價","price":120}]},{"name":"鮮魚片","sizes":[{"name":"單價","price":120}]},{"name":"鮮凍剝殼活蝦","sizes":[{"name":"單價","price":130}]},{"name":"綜合丸餃拼盤","sizes":[{"name":"單價","price":180}]},{"name":"科學麵","sizes":[{"name":"單價","price":10}]},{"name":"黑羽土雞蛋","sizes":[{"name":"單價","price":20}]},{"name":"烏龍麵","sizes":[{"name":"單價","price":20}]},{"name":"油豆腐","sizes":[{"name":"單價","price":30}]},{"name":"芋頭","sizes":[{"name":"單價","price":50}]},{"name":"魚餃","sizes":[{"name":"單價","price":50}]}]}]};
        const optionsData = {"categories":[{"name":"美味主餐","hasPrice":true,"options":[{"name":"(素)蔬食沙拉吧","price":240},{"name":"去骨鮮嫩雞腿肉","price":270},{"name":"本土松阪豬肉片","price":290},{"name":"美國雪花牛肉片","price":290},{"name":"伊比利梅花豬肉片","price":300},{"name":"紐西蘭羊腿肉片","price":300},{"name":"美國板腱牛肉片","price":320},{"name":"豪華海鮮拼盤","price":320},{"name":"安格斯牛小排肉片","price":450}]}]};
        const googleScriptUrl = 'https://script.google.com/macros/s/AKfycbwvhKOFegxQ5F1mk7KYgWKlol-XOoFymtXTxlcaEhEae-DWynTM7sEexl8uaH_NdWQAXw/exec';
        let orders = {};

        function toggleOrder() { document.getElementById('orderSection').classList.toggle('collapsed'); }

        function switchCatTab(catIndex) {
            document.querySelectorAll('.cat-tab-btn').forEach(function(btn, i) { btn.classList.toggle('active', i === catIndex); });
            document.querySelectorAll('.menu-section').forEach(function(section, i) { section.classList.toggle('active', i === catIndex); });
        }

        function initTabsDrag() {
            var tabs = document.getElementById('categoryTabs');
            var isDown = false, startX, scrollLeft;
            tabs.addEventListener('mousedown', function(e) { isDown = true; tabs.style.cursor = 'grabbing'; startX = e.pageX - tabs.offsetLeft; scrollLeft = tabs.scrollLeft; });
            tabs.addEventListener('mouseleave', function() { isDown = false; tabs.style.cursor = 'grab'; });
            tabs.addEventListener('mouseup', function() { isDown = false; tabs.style.cursor = 'grab'; });
            tabs.addEventListener('mousemove', function(e) { if (!isDown) return; e.preventDefault(); var x = e.pageX - tabs.offsetLeft; tabs.scrollLeft = scrollLeft - (x - startX); });
        }

        function renderMenu() {
            var container = document.getElementById('menuContainer');
            var tabsContainer = document.getElementById('categoryTabs');
            var tabsHtml = '';
            menuData.categories.forEach(function(cat, catIndex) {
                tabsHtml += '<button class="cat-tab-btn' + (catIndex === 0 ? ' active' : '') + '" onclick="switchCatTab(' + catIndex + ')">' + cat.name + '</button>';
            });
            tabsContainer.innerHTML = tabsHtml;

            var html = '';
            var itemIndex = 0;
            menuData.categories.forEach(function(cat, catIndex) {
                html += '<div class="menu-section' + (catIndex === 0 ? ' active' : '') + '"><div class="menu-title">' + cat.name + '</div>';
                if (cat.note) html += '<div class="menu-note">' + cat.note + '</div>';
                cat.items.forEach(function(item) {
                    var itemKey = 'item_' + itemIndex;
                    var sizes = item.sizes || [{ name: '', price: item.priceM || item.priceL || 0 }];
                    orders[itemKey] = { name: item.name, qty: 0, size: sizes.length === 1 ? sizes[0] : null, options: {}, price: sizes.length === 1 ? sizes[0].price : 0, sizes: sizes };
                    var priceDisplay = sizes.length === 1 ? '$' + sizes[0].price : sizes.map(function(s) { return s.name + ' $' + s.price; }).join(' / ');
                    html += '<div class="menu-item" data-item-key="' + itemKey + '"><div class="item-header"><span class="item-name">' + item.name + '</span><span class="price-tag">' + priceDisplay + '</span></div>';
                    if (item.desc) html += '<div class="item-desc">' + item.desc + '</div>';
                    html += '<div class="item-options">';
                    if (sizes.length > 1) {
                        html += '<div class="option-group"><span class="option-label">規格:</span>';
                        sizes.forEach(function(size, sizeIdx) { html += '<button class="opt-btn size-btn" data-size-idx="' + sizeIdx + '" data-price="' + size.price + '" data-size-name="' + size.name + '">' + size.name + '</button>'; });
                        html += '</div>';
                    }
                    if (optionsData && optionsData.categories) {
                        optionsData.categories.forEach(function(optCat, optCatIdx) {
                            if (optCat.options && optCat.options.length > 0) {
                                if (optCat.hasPrice && !cat.showPricedOptions) return;
                                html += '<div class="option-group" data-opt-cat="' + optCatIdx + '"><span class="option-label">' + optCat.name + ':</span>';
                                optCat.options.forEach(function(opt) {
                                    var optName = optCat.hasPrice ? opt.name : opt;
                                    var optPrice = optCat.hasPrice ? opt.price : 0;
                                    var label = optCat.hasPrice ? optName + ' $' + optPrice : optName;
                                    html += '<button class="opt-btn option-btn" data-opt-cat="' + optCatIdx + '" data-opt-val="' + optName + '" data-opt-price="' + optPrice + '">' + label + '</button>';
                                });
                                html += '</div>';
                            }
                        });
                    }
                    html += '<div class="quantity-control"><button class="qty-btn minus-btn">-</button><span class="qty-display">0</span><button class="qty-btn plus-btn">+</button></div></div></div>';
                    itemIndex++;
                });
                html += '</div>';
            });
            container.innerHTML = html;
            bindEvents();
            initTabsDrag();
        }

        function bindEvents() {
            document.querySelectorAll('.menu-item').forEach(function(item) {
                var itemKey = item.dataset.itemKey;
                item.querySelectorAll('.size-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        item.querySelectorAll('.size-btn').forEach(function(b) { b.classList.remove('selected'); });
                        btn.classList.add('selected');
                        var sizeIdx = parseInt(btn.dataset.sizeIdx);
                        orders[itemKey].size = orders[itemKey].sizes[sizeIdx];
                        orders[itemKey].price = orders[itemKey].sizes[sizeIdx].price;
                        updateOrder();
                    });
                });
                item.querySelectorAll('.option-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var optCat = btn.dataset.optCat;
                        item.querySelectorAll('.option-btn[data-opt-cat="' + optCat + '"]').forEach(function(b) { b.classList.remove('selected'); });
                        btn.classList.add('selected');
                        orders[itemKey].options[optCat] = { val: btn.dataset.optVal, price: parseInt(btn.dataset.optPrice) || 0 };
                        updateOrder();
                    });
                });
                item.querySelector('.minus-btn').addEventListener('click', function() { changeQty(itemKey, -1, item); });
                item.querySelector('.plus-btn').addEventListener('click', function() { changeQty(itemKey, 1, item); });
            });
        }

        function getOptionPriceTotal(order) {
            var optTotal = 0;
            if (order.options) Object.keys(order.options).forEach(function(k) {
                var o = order.options[k];
                if (o && typeof o === 'object' && o.price) optTotal += o.price;
            });
            return optTotal;
        }

        function getOptionVal(opt) { return (opt && typeof opt === 'object') ? opt.val : opt; }

        function changeQty(itemKey, delta, menuItem) {
            var newQty = orders[itemKey].qty + delta;
            if (newQty < 0) newQty = 0;
            orders[itemKey].qty = newQty;
            menuItem.querySelector('.qty-display').textContent = newQty;
            updateOrder();
        }

        function updateOrder() {
            var summaryDiv = document.getElementById('orderSummary');
            var totalDiv = document.getElementById('orderTotal');
            var submitBtn = document.getElementById('submitBtn');
            var copyBtn = document.getElementById('copyBtn');
            var html = '', total = 0, hasItems = false, totalQty = 0;
            for (var key in orders) {
                var order = orders[key];
                if (order.qty > 0) {
                    hasItems = true;
                    var unitPrice = order.price + getOptionPriceTotal(order);
                    var itemTotal = unitPrice * order.qty;
                    total += itemTotal;
                    totalQty += order.qty;
                    var details = [];
                    if (order.size && order.size.name) details.push(order.size.name);
                    if (optionsData && optionsData.categories) Object.keys(order.options).forEach(function(catIdx) { details.push(getOptionVal(order.options[catIdx])); });
                    var detailStr = details.length > 0 ? ' (' + details.join('/') + ')' : '';
                    html += '<div class="order-item"><span>' + order.name + detailStr + ' x' + order.qty + '</span><span>$' + itemTotal + '</span></div>';
                }
            }
            summaryDiv.innerHTML = hasItems ? html : '<div class="empty-order">尚未選擇任何品項</div>';
            totalDiv.textContent = '總計: $' + total;
            submitBtn.disabled = !hasItems;
            copyBtn.style.display = hasItems ? 'block' : 'none';
            document.getElementById('orderBadge').textContent = totalQty > 0 ? '(' + totalQty + '份 $' + total + ')' : '';
        }

        async function submitOrder() {
            var ordererName = document.getElementById('ordererName').value.trim();
            if (!ordererName) { alert('請輸入點單人姓名！'); return; }
            var submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = '送出中...';
            submitBtn.disabled = true;
            var optionNames = [];
            if (optionsData && optionsData.categories) optionsData.categories.forEach(function(cat) { if (cat.options && cat.options.length > 0) optionNames.push(cat.name); });
            var orderList = [];
            var total = 0;
            for (var key in orders) {
                var order = orders[key];
                if (order.qty > 0) {
                    var unitPrice = order.price + getOptionPriceTotal(order);
                    var subtotal = unitPrice * order.qty;
                    total += subtotal;
                    var optionValues = {};
                    if (optionsData && optionsData.categories) Object.keys(order.options).forEach(function(catIdx) { optionValues[optionsData.categories[catIdx].name] = getOptionVal(order.options[catIdx]); });
                    orderList.push({ item: order.name, size: order.size ? order.size.name : '', optionValues: optionValues, qty: order.qty, price: unitPrice, subtotal: subtotal });
                }
            }
            var payload = { orderer: ordererName, orders: orderList, optionNames: optionNames, total: total };
            if (googleScriptUrl) {
                try {
                    await fetch(googleScriptUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    document.getElementById('successMsg').style.display = 'block';
                    setTimeout(function() { document.getElementById('successMsg').style.display = 'none'; }, 5000);
                } catch (err) { alert('送出失敗，請使用複製訂單功能'); }
            } else {
                var orderText = '【訂單】\n點單人: ' + ordererName + '\n\n';
                orderList.forEach(function(o) { var opts = Object.values(o.optionValues || {}).join('/'); var detail = [o.size, opts].filter(function(x) { return x; }).join('/'); orderText += o.item + (detail ? ' (' + detail + ')' : '') + ' x' + o.qty + ' = $' + o.subtotal + '\n'; });
                orderText += '\n總計: $' + total;
                alert('訂單內容：\n\n' + orderText);
            }
            submitBtn.textContent = '送出訂單';
            submitBtn.disabled = false;
            resetOrder();
        }

        function resetOrder() {
            for (var key in orders) {
                orders[key].qty = 0;
                orders[key].size = orders[key].sizes.length === 1 ? orders[key].sizes[0] : null;
                orders[key].options = {};
                orders[key].price = orders[key].sizes.length === 1 ? orders[key].sizes[0].price : 0;
            }
            document.querySelectorAll('.menu-item').forEach(function(item) {
                item.querySelectorAll('.opt-btn').forEach(function(btn) { btn.classList.remove('selected'); });
                item.querySelector('.qty-display').textContent = '0';
            });
            updateOrder();
        }

        function copyOrder() {
            var ordererName = document.getElementById('ordererName').value.trim() || '未填寫';
            var orderText = '【訂單】\n點單人: ' + ordererName + '\n\n';
            var total = 0;
            for (var key in orders) {
                var order = orders[key];
                if (order.qty > 0) {
                    var unitPrice = order.price + getOptionPriceTotal(order);
                    var itemTotal = unitPrice * order.qty;
                    total += itemTotal;
                    var details = [];
                    if (order.size && order.size.name) details.push(order.size.name);
                    if (optionsData && optionsData.categories) Object.keys(order.options).forEach(function(catIdx) { details.push(getOptionVal(order.options[catIdx])); });
                    var detailStr = details.length > 0 ? ' (' + details.join('/') + ')' : '';
                    orderText += order.name + detailStr + ' x' + order.qty + ' = $' + itemTotal + '\n';
                }
            }
            orderText += '\n總計: $' + total;
            navigator.clipboard.writeText(orderText).then(function() { alert('訂單已複製到剪貼簿！'); }).catch(function() { prompt('請手動複製:', orderText); });
        }

        renderMenu();
    </script>
</body>
</html>
