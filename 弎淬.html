<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點餐系統</title>
    <style>
        * { box-sizing: border-box; font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .menu-section { background: #f8f9fa; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .menu-title { font-size: 20px; font-weight: bold; color: #4a5568; margin-bottom: 5px; padding-bottom: 10px; border-bottom: 2px solid #667eea; }
        .menu-note { font-size: 12px; color: #888; margin-bottom: 15px; }
        .menu-item { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .item-name { font-weight: bold; font-size: 16px; color: #333; }
        .item-desc { font-size: 12px; color: #888; margin-bottom: 10px; }
        .item-options { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .option-group { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .option-label { font-size: 12px; color: #666; margin-right: 5px; }
        .opt-btn { padding: 5px 12px; border: 2px solid #ddd; border-radius: 20px; background: white; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .opt-btn:hover { border-color: #667eea; }
        .opt-btn.selected { background: #667eea; color: white; border-color: #667eea; }
        .quantity-control { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 30px; height: 30px; border: none; border-radius: 50%; background: #667eea; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .qty-btn:hover { background: #5a6fd6; }
        .qty-display { font-size: 16px; font-weight: bold; min-width: 30px; text-align: center; }
        .order-section { background: #fff3cd; border-radius: 15px; padding: 20px; margin-top: 20px; }
        .order-title { font-size: 18px; font-weight: bold; color: #856404; margin-bottom: 15px; }
        .orderer-input { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; margin-bottom: 15px; }
        .orderer-input:focus { outline: none; border-color: #667eea; }
        .order-summary { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; max-height: 250px; overflow-y: auto; }
        .order-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .order-item:last-child { border-bottom: none; }
        .order-total { font-size: 20px; font-weight: bold; text-align: right; color: #333; margin-bottom: 15px; }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
        .copy-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; display: none; }
        .copy-btn:hover { background: #218838; }
        .empty-order { text-align: center; color: #999; padding: 20px; }
        .price-tag { background: #667eea; color: white; padding: 3px 8px; border-radius: 10px; font-size: 12px; }
        .success-msg { background: #d4edda; color: #155724; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; }
        @media (max-width: 600px) { .item-options { flex-direction: column; align-items: flex-start; } .option-group { margin-bottom: 5px; } .container { padding: 15px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>點餐</h1>
        <p class="subtitle" id="pageSubtitle"></p>
        <div id="menuContainer"></div>
        <div class="order-section">
            <div class="order-title">訂單資訊</div>
            <div class="success-msg" id="successMsg">訂單已成功送出！</div>
            <input type="text" class="orderer-input" id="ordererName" placeholder="請輸入點單人姓名">
            <div class="order-summary" id="orderSummary"><div class="empty-order">尚未選擇任何品項</div></div>
            <div class="order-total" id="orderTotal">總計: $0</div>
            <button class="submit-btn" id="submitBtn" onclick="submitOrder()" disabled>送出訂單</button>
            <button class="copy-btn" id="copyBtn" onclick="copyOrder()">複製訂單內容</button>
        </div>
    </div>
    <script>
        const menuData = {"categories":[{"name":"純淬香茗","items":[{"name":"式淬烤茶","desc":"產地日本靜岡 Triple-Infused Roasted Tea","sizes":[{"name":"M","price":25},{"name":"L","price":30}]},{"name":"茉香綠茶","desc":"Jasmine Green Tea","sizes":[{"name":"M","price":25},{"name":"L","price":30}]},{"name":"金麥紅茶","desc":"Golden Wheat Black Tea","sizes":[{"name":"M","price":25},{"name":"L","price":30}]},{"name":"式淬高山青","desc":"Triple-Infused Oolong Tea","sizes":[{"name":"M","price":25},{"name":"L","price":30}]},{"name":"玄米蕎麥","desc":"無咖啡因 Brown Rice Buckwheat","sizes":[{"name":"M","price":25},{"name":"L","price":30}]}]},{"name":"式淬特調","items":[{"name":"金梅綠 | 青","desc":"Golden Plum Green Tea","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"紫蘇梅綠 | 青","desc":"Perilla Plum Green Tea","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"多多綠 | 青","desc":"Pudding Green Tea","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"冰淇淋紅|綠|青| 烤","desc":"Ice cream Black The Oolong The Green The","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"綠豆冰沙","desc":"Mung Bean Smoothie","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"綠豆沙牛奶","desc":"Mung Bean Milkshake","sizes":[{"name":"M","price":55},{"name":"L","price":65}]},{"name":"手標泰式奶茶","desc":"Handcrafted Thai Milk Tea","sizes":[{"name":"L","price":65}]},{"name":"手標泰式奶綠","desc":"Handcrafted Thai Milk Green Tea","sizes":[{"name":"L","price":65}]},{"name":"手標泰式檸檬茶","desc":"Handcrafted Thai Lemon Tea","sizes":[{"name":"L","price":60}]},{"name":"玄米蕎麥茶凍凍","desc":"Brown Rice Buckwheat Tea with Tea Jelly","sizes":[{"name":"M","price":40},{"name":"L","price":45}]}]},{"name":"台灣甜蜜蜜","items":[{"name":"台灣蜜茶","desc":"Taiwan Honey Tea","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"蜂蜜綠紅|青|烤","desc":"Honey Green Tea Black The Oolong The Roasted The","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"蜂蜜檸檬","desc":"Honey Lemon","sizes":[{"nam e":"L","price":65}]},{"name":"布丁烤牛奶","desc":"Pudding Roasted Milk Tea","sizes":[{"name":"M","price":55},{"name":"L","price":70}]},{"name":"冰淇淋紅茶鮮奶","desc":"Ice Cream Black Tea with Fresh Milk","sizes":[{"name":"M","price":60},{"name":"L","price":75}]},{"name":"Oreo仙草凍鮮奶茶","desc":"Oreo Herbal Jelly Fresh Milk Tea","sizes":[{"name":"L","price":75}]},{"name":"布丁鮮奶茶綠青","desc":"Pudding Fresh Milk Tea","sizes":[{"name":"M","price":55},{"name":"L","price":70}]},{"name":"烤牛奶凍凍","desc":"Roasted Milk with Tea Jelly","sizes":[{"name":"M","price":60},{"name":"L","price":70}]}]},{"name":"嚴選九如檸檬","items":[{"name":"檸檬紅綠青","desc":"Lemon Black Tea Lemon Green Tea","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"檸檬蜜綠|青","desc":"Honey Lemon Oolong The Green Tea","sizes":[{"name":"M","price":55},{"name":"L","price":65}]},{"name":"九如檸檬汁","desc":"Lemon Juice","sizes":[{"name":"M","price":45},{"name":"L","price":55}]},{"name":"鮮桔檸檬","desc":"Fresh Orange Lemon","sizes":[{"name":"M","price":45},{"name":"L","price":55}]},{"name":"梅釀檸檬","desc":"Plum Lemon","sizes":[{"name":"M","price":45},{"name":"L","price":55}]},{"name":"檸檬多多","desc":"Lemon Pudding","sizes":[{"name":"M","price":50},{"name":"L","price":60}]},{"name":"鮮桔多多","desc":"Fresh Orange Pudding","sizes":[{"name":"M","price":50},{"name":"L","price":60}]}]},{"name":"海鹽起司奶蓋","items":[{"name":"奶蓋紅綠青|烤","desc":"Milk Cap Black Tea Oolong The Green The Roosted. The","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"奶蓋玄米蕎麥","desc":"Milk Cap Brown Rice Buckwheat","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"奶蓋蜂蜜紅綠青|烤","desc":"Milk Cap Honey Black Tea Oolong The Green Tha","sizes":[{"name":"M","price":50},{"name":"L","price":55}]},{"name":"奶蓋咖啡","desc":"Milk Cap Coffee","sizes":[{"name":"M","price":55},{"name":"L","price":65}]},{"name":"奶蓋可可歐蕾","desc":"Milk Cap Cocoa Au Lait","sizes":[{"name":"M","price":55},{"name":"L","price":65}]},{"name":"Oreo奶蓋可可歐蕾","desc":"Oreo Cream Cheese Cocoa Au Lait","sizes":[{"name":"L","price":75}]}]},{"name":"濃厚奶香","items":[{"name":"式淬奶茶","desc":"Triple-Infused Milk Tea","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"茉綠奶茶","desc":"Jasmine Green Milk Tea","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"玄米蕎麥奶茶","desc":"Pudding Milk Tea Milk Green Tea","sizes":[{"name":"M","price":50},{"name":"L","price":60}]},{"name":"珍珠奶茶","desc":"Pearl Milk Tea","sizes":[{"name":"M","price":50},{"name":"L","price":55}]},{"name":"阿華田奶茶","desc":"Ovaltine Milk Tea","sizes":[{"name":"M","price":45},{"name":"L","price":55}]},{"name":"可可歐蕾","desc":"Cocoa Au Lait","sizes":[{"name":"M","price":45},{"name":"L","price":55}]},{"name":"式淬奶茶聯盟","desc":"Triple-Infused Milk Tea Alliance","sizes":[{"name":"M","price":45},{"name":"L","price":55}]},{"name":"嫩仙草奶茶","desc":"Tender Grass Jelly Milk Tea","sizes":[{"name":"M","price":50},{"name":"L","price":55}]},{"name":"冰淇淋奶茶","desc":"Ice Cream Milk Tea","sizes":[{"name":"M","price":50},{"name":"L","price":60}]},{"name":"布丁奶茶|奶綠","desc":"Pudding Milk Tea Milk Green Tea","sizes":[{"name":"M","price":50},{"name":"L","price":65}]},{"name":"Oreo仙草凍奶","desc":"Oreo Herbal Jelly Milk Tea","sizes":[{"name":"M","price":55},{"name":"L","price":65}]}]},{"name":"冬瓜系列","items":[{"name":"手工熬煮冬瓜茶","desc":"Handmade Winter Melon Tea","sizes":[{"name":"M","price":25},{"name":"L","price":30}]},{"name":"冬瓜紅綠| 青|烤","desc":"Winter Melon","sizes":[{"name":"M","price":25},{"name":"L","price":30}]},{"name":"冬瓜檸檬","desc":"Winter Melon Lemon","sizes":[{"name":"M","price":40},{"name":"L","price":50}]},{"name":"冬瓜鮮奶","desc":"Winter Melon Fresh Milk","sizes":[{"name":"M","price":45},{"name":"L","price":55}]},{"name":"冬瓜仙草撞奶","desc":"Winter Melon Grass Jelly Milk","sizes":[{"name":"M","price":55},{"name":"L","price":65}]}]}]};
        const optionsData = {"categories":[{"name":"甜度","options":["無糖","微糖","半糖","全糖"]},{"name":"冰量","options":["去冰","微冰","少冰","正常冰","溫","熱飲"]}]};
        const googleScriptUrl = 'https://script.google.com/macros/s/AKfycbwvhKOFegxQ5F1mk7KYgWKlol-XOoFymtXTxlcaEhEae-DWynTM7sEexl8uaH_NdWQAXw/exec';
        let orders = {};

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            let html = '';
            let itemIndex = 0;
            menuData.categories.forEach((cat) => {
                html += '<div class="menu-section"><div class="menu-title">' + cat.name + '</div>';
                if (cat.note) html += '<div class="menu-note">' + cat.note + '</div>';
                cat.items.forEach((item) => {
                    const itemKey = 'item_' + itemIndex;
                    const sizes = item.sizes || [{ name: '', price: item.priceM || item.priceL || 0 }];
                    orders[itemKey] = { name: item.name, qty: 0, size: sizes.length === 1 ? sizes[0] : null, options: {}, price: sizes.length === 1 ? sizes[0].price : 0, sizes: sizes };
                    let priceDisplay = sizes.length === 1 ? '$' + sizes[0].price : sizes.map(s => s.name + ' $' + s.price).join(' / ');
                    html += '<div class="menu-item" data-item-key="' + itemKey + '"><div class="item-header"><span class="item-name">' + item.name + '</span><span class="price-tag">' + priceDisplay + '</span></div>';
                    if (item.desc) html += '<div class="item-desc">' + item.desc + '</div>';
                    html += '<div class="item-options">';
                    if (sizes.length > 1) {
                        html += '<div class="option-group"><span class="option-label">規格:</span>';
                        sizes.forEach((size, sizeIdx) => { html += '<button class="opt-btn size-btn" data-size-idx="' + sizeIdx + '" data-price="' + size.price + '" data-size-name="' + size.name + '">' + size.name + '</button>'; });
                        html += '</div>';
                    }
                    if (optionsData && optionsData.categories) {
                        optionsData.categories.forEach((optCat, optCatIdx) => {
                            if (optCat.options && optCat.options.length > 0) {
                                html += '<div class="option-group" data-opt-cat="' + optCatIdx + '"><span class="option-label">' + optCat.name + ':</span>';
                                optCat.options.forEach((opt) => { html += '<button class="opt-btn option-btn" data-opt-cat="' + optCatIdx + '" data-opt-val="' + opt + '">' + opt + '</button>'; });
                                html += '</div>';
                            }
                        });
                    }
                    html += '<div class="quantity-control"><button class="qty-btn minus-btn">-</button><span class="qty-display">0</span><button class="qty-btn plus-btn">+</button></div></div></div>';
                    itemIndex++;
                });
                html += '</div>';
            });
            container.innerHTML = html;
            bindEvents();
        }

        function bindEvents() {
            document.querySelectorAll('.menu-item').forEach(item => {
                const itemKey = item.dataset.itemKey;
                item.querySelectorAll('.size-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        item.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        const sizeIdx = parseInt(btn.dataset.sizeIdx);
                        orders[itemKey].size = orders[itemKey].sizes[sizeIdx];
                        orders[itemKey].price = orders[itemKey].sizes[sizeIdx].price;
                        updateOrder();
                    });
                });
                item.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const optCat = btn.dataset.optCat;
                        item.querySelectorAll('.option-btn[data-opt-cat="' + optCat + '"]').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        orders[itemKey].options[optCat] = btn.dataset.optVal;
                        updateOrder();
                    });
                });
                item.querySelector('.minus-btn').addEventListener('click', () => changeQty(itemKey, -1, item));
                item.querySelector('.plus-btn').addEventListener('click', () => changeQty(itemKey, 1, item));
            });
        }

        function changeQty(itemKey, delta, menuItem) {
            let newQty = orders[itemKey].qty + delta;
            if (newQty < 0) newQty = 0;
            orders[itemKey].qty = newQty;
            menuItem.querySelector('.qty-display').textContent = newQty;
            updateOrder();
        }

        function updateOrder() {
            const summaryDiv = document.getElementById('orderSummary');
            const totalDiv = document.getElementById('orderTotal');
            const submitBtn = document.getElementById('submitBtn');
            const copyBtn = document.getElementById('copyBtn');
            let html = '', total = 0, hasItems = false;
            for (const [key, order] of Object.entries(orders)) {
                if (order.qty > 0) {
                    hasItems = true;
                    const itemTotal = order.price * order.qty;
                    total += itemTotal;
                    const details = [];
                    if (order.size && order.size.name) details.push(order.size.name);
                    if (optionsData && optionsData.categories) Object.keys(order.options).forEach(catIdx => details.push(order.options[catIdx]));
                    const detailStr = details.length > 0 ? ' (' + details.join('/') + ')' : '';
                    html += '<div class="order-item"><span>' + order.name + detailStr + ' x' + order.qty + '</span><span>$' + itemTotal + '</span></div>';
                }
            }
            summaryDiv.innerHTML = hasItems ? html : '<div class="empty-order">尚未選擇任何品項</div>';
            totalDiv.textContent = '總計: $' + total;
            submitBtn.disabled = !hasItems;
            copyBtn.style.display = hasItems ? 'block' : 'none';
        }

        async function submitOrder() {
            const ordererName = document.getElementById('ordererName').value.trim();
            if (!ordererName) { alert('請輸入點單人姓名！'); return; }
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = '送出中...';
            submitBtn.disabled = true;
            const optionNames = [];
            if (optionsData && optionsData.categories) optionsData.categories.forEach(cat => { if (cat.options && cat.options.length > 0) optionNames.push(cat.name); });
            const orderList = [];
            let total = 0;
            for (const [key, order] of Object.entries(orders)) {
                if (order.qty > 0) {
                    const subtotal = order.price * order.qty;
                    total += subtotal;
                    const optionValues = {};
                    if (optionsData && optionsData.categories) Object.keys(order.options).forEach(catIdx => { optionValues[optionsData.categories[catIdx].name] = order.options[catIdx]; });
                    orderList.push({ item: order.name, size: order.size ? order.size.name : '', optionValues: optionValues, qty: order.qty, price: order.price, subtotal: subtotal });
                }
            }
            const payload = { orderer: ordererName, orders: orderList, optionNames: optionNames, total: total };
            if (googleScriptUrl) {
                try {
                    await fetch(googleScriptUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    document.getElementById('successMsg').style.display = 'block';
                    setTimeout(() => { document.getElementById('successMsg').style.display = 'none'; }, 5000);
                } catch (err) { alert('送出失敗，請使用複製訂單功能'); }
            } else {
                let orderText = '【訂單】\n點單人: ' + ordererName + '\n\n';
                orderList.forEach(o => { const opts = Object.values(o.optionValues || {}).join('/'); const detail = [o.size, opts].filter(x => x).join('/'); orderText += o.item + (detail ? ' (' + detail + ')' : '') + ' x' + o.qty + ' = $' + o.subtotal + '\n'; });
                orderText += '\n總計: $' + total;
                alert('訂單內容：\n\n' + orderText);
            }
            submitBtn.textContent = '送出訂單';
            submitBtn.disabled = false;
            resetOrder();
        }

        function resetOrder() {
            for (const key of Object.keys(orders)) {
                orders[key].qty = 0;
                orders[key].size = orders[key].sizes.length === 1 ? orders[key].sizes[0] : null;
                orders[key].options = {};
                orders[key].price = orders[key].sizes.length === 1 ? orders[key].sizes[0].price : 0;
            }
            document.querySelectorAll('.menu-item').forEach(item => {
                item.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
                item.querySelector('.qty-display').textContent = '0';
            });
            updateOrder();
        }

        function copyOrder() {
            const ordererName = document.getElementById('ordererName').value.trim() || '未填寫';
            let orderText = '【訂單】\n點單人: ' + ordererName + '\n\n';
            let total = 0;
            for (const [key, order] of Object.entries(orders)) {
                if (order.qty > 0) {
                    const itemTotal = order.price * order.qty;
                    total += itemTotal;
                    const details = [];
                    if (order.size && order.size.name) details.push(order.size.name);
                    if (optionsData && optionsData.categories) Object.keys(order.options).forEach(catIdx => details.push(order.options[catIdx]));
                    const detailStr = details.length > 0 ? ' (' + details.join('/') + ')' : '';
                    orderText += order.name + detailStr + ' x' + order.qty + ' = $' + itemTotal + '\n';
                }
            }
            orderText += '\n總計: $' + total;
            navigator.clipboard.writeText(orderText).then(() => alert('訂單已複製到剪貼簿！')).catch(() => prompt('請手動複製:', orderText));
        }

        renderMenu();
    </script>
</body>
</html>
